<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Administration du portfolio</title>
  </head>
  <body>
    <script>
      // Initialisation manuelle : on complète config.yml avec l'URL du site courant,
      // pour que l'authentification GitHub passe par /api/auth de CE déploiement.
      window.CMS_MANUAL_INIT = true;
    </script>
    <script src="https://unpkg.com/decap-cms@3.16.3/dist/decap-cms.js"></script>
    <script>
      CMS.init({
        config: {
          backend: {
            base_url: window.location.origin,
            auth_endpoint: "api/auth",
          },
        },
      });
    </script>
  </body>
</html>
